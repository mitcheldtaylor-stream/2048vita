name: build vpk

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        shell: bash
        run: |
          set -eux
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends cmake make imagemagick zip python3 fonts-dejavu-core
          elif command -v apk >/dev/null; then
            apk add --no-cache cmake make imagemagick zip python3 ttf-dejavu
          else
            echo "no supported package manager found" >&2
            exit 1
          fi

      - name: Generate LiveArea artwork
        shell: bash
        run: |
          set -eux
          mkdir -p sce_sys/livearea/contents

          # ImageMagick 7 ships `magick`, ImageMagick 6 ships `convert`
          if command -v magick >/dev/null; then
            IM="magick"
          else
            IM="convert"
          fi

          # ImageMagick has no font configured in this container, so point it
          # at a TTF explicitly. If none is found, fall back to plain tiles
          # rather than failing the build.
          FONT=""
          for f in \
            /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
            /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            /usr/share/fonts/TTF/DejaVuSans-Bold.ttf; do
            if [ -f "$f" ]; then FONT="$f"; break; fi
          done

          # The LiveArea decoder rejects exotic PNG encodings, and ImageMagick
          # will happily emit a 1-bit or palette PNG for a flat colour. PNG32:
          # plus an explicit type/depth forces plain 8-bit RGBA, non-interlaced.
          PNGOPTS="-type TrueColorAlpha -depth 8 -interlace none -define png:color-type=6 -define png:bit-depth=8"

          # Draws a solid tile, with the "2048" label only if a font was found.
          tile() {
            size="$1"; bg="$2"; pointsize="$3"; out="$4"
            if [ -n "$FONT" ]; then
              $IM -size "$size" "xc:$bg" -font "$FONT" -gravity center \
                -fill '#F9F6F2' -pointsize "$pointsize" -annotate 0 '2048' \
                $PNGOPTS "PNG32:$out"
            else
              $IM -size "$size" "xc:$bg" $PNGOPTS "PNG32:$out"
            fi
          }

          # icon0.png must be exactly 128x128
          tile 128x128 '#EDC22E' 40 sce_sys/icon0.png
          tile 280x158 '#EDC22E' 48 sce_sys/livearea/contents/startup.png
          $IM -size 840x500 'xc:#FAF8EF' $PNGOPTS \
            PNG32:sce_sys/livearea/contents/bg.png

          echo "--- generated PNG formats ---"
          identify -verbose sce_sys/icon0.png | grep -iE 'geometry|type|depth|interlace|colorspace' || true
          identify sce_sys/icon0.png sce_sys/livearea/contents/*.png

          ls -l sce_sys sce_sys/livearea/contents

      - name: Build
        shell: bash
        run: |
          set -eux
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -l build/*.vpk

      - uses: actions/upload-artifact@v4
        with:
          name: vita2048-vpk
          path: build/vita2048.vpk
          if-no-files-found: error
