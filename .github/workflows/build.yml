name: build vpk

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        shell: bash
        run: |
          set -eux
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends cmake make imagemagick zip python3
          elif command -v apk >/dev/null; then
            apk add --no-cache cmake make imagemagick zip python3
          else
            echo "no supported package manager found" >&2
            exit 1
          fi

      - name: Generate LiveArea artwork
        shell: bash
        run: |
          set -eux
          mkdir -p sce_sys/livearea/contents

          # ImageMagick 7 ships `magick`, ImageMagick 6 ships `convert`
          if command -v magick >/dev/null; then
            IM="magick"
          else
            IM="convert"
          fi

          # icon0.png must be exactly 128x128
          $IM -size 128x128 xc:'#EDC22E' \
            -gravity center -fill '#F9F6F2' -pointsize 40 -annotate 0 '2048' \
            sce_sys/icon0.png
          $IM -size 840x500 xc:'#FAF8EF' sce_sys/livearea/contents/bg.png
          $IM -size 280x158 xc:'#EDC22E' \
            -gravity center -fill '#F9F6F2' -pointsize 48 -annotate 0 '2048' \
            sce_sys/livearea/contents/startup.png

          ls -l sce_sys sce_sys/livearea/contents

      - name: Build
        shell: bash
        run: |
          set -eux
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -l build/*.vpk

      - uses: actions/upload-artifact@v4
        with:
          name: vita2048-vpk
          path: build/vita2048.vpk
          if-no-files-found: error
